name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build (.NET 10 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check transaction policy matrix (MustTx)
        run: pwsh ../scripts/check-transaction-policy.ps1

      - name: Restore
        run: dotnet restore backend.sln

      - name: Build
        run: dotnet build backend.sln -c Release --no-restore

      - name: Test (if test projects exist)
        shell: bash
        run: |
          if find . -type f \( -name "*Test*.csproj" -o -name "*Tests*.csproj" \) | grep -q .; then
            dotnet test backend.sln -c Release --no-build --verbosity normal
          else
            echo "No test projects found, skipping dotnet test."
          fi

  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run verify

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-build
      - frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mygarage-app:ci
          build-args: |
            VITE_GOOGLE_CLIENT_ID=dummy-ci-client-id
          cache-from: type=gha
          cache-to: type=gha,mode=max
