services:
  mygarage-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
        # Vite variables are injected at build-time, not runtime.
        # Require this to avoid silently producing a broken frontend bundle.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID before build}
        NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
    container_name: mygarage-app
    image: mygarage-app:prod
    restart: unless-stopped
    ports:
      # Map configurable host port (default 80) to container port 8080.
      - "${APP_PORT:-80}:8080"
    env_file:
      - ./Frontend/.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: Error
    healthcheck:
      # Poll the backend liveness endpoint every 30 s.
      # curl is available in the aspnet runtime image.
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # give the app time to migrate DB / warm up
    deploy:
      resources:
        limits:
          memory: 512M    # prevent OOM on small VPS; raise if needed
          cpus: "0.75"
        reservations:
          memory: 128M
          cpus: "0.25"
